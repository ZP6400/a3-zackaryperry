<!doctype html>
<html lang='en'>
  <head>
    <title>Key Hole Boogie - CS4241 A2</title>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=0.6" />

    <link rel='stylesheet' href='css/main.css' />
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='css/main.css' />
  </head>
  <body>
    <header>
      <h1 id="title">Key Hole Boogie</h1>
      <p class="subtitle">Press the key of the targeted hole before the ball reaches it!</p>
    </header>
    
    <main class="layout">
      <section class="card game-card">
        <div class="hud">
          <span>Score: <strong id="hud-score">0</strong></span>
          <span>Survival Time: <strong id="hud-timer">0</strong>s</span>
        </div>

        <div id="game-space">
          <div class="hole" id="hole-0"><span class="hole-key"></span></div>
          <div class="hole" id="hole-1"><span class="hole-key"></span></div>
          <div class="hole" id="hole-2"><span class="hole-key"></span></div>
          <div class="hole" id="hole-3"><span class="hole-key"></span></div>
          <div id="ball"></div>
        </div>

        <button id="start-btn" class="btn btn-start">Start Game</button>
      </section>

      <section class="card form-card">
        <h2 id="form-heading">Record Your Score</h2>
        <form id="score-form">
          <input type="hidden" id="entry-id" value="">
          
          <div class="form-space">
            <label for="username">Username:</label>
            <input type="text" id="username" required maxlength="16">
          </div>

          <div class="form-space">
            <label for="score">Score:</label>
            <input type="number" id="score" required min="0" value="0">
          </div>

          <div class="form-space">
            <label for="duration">Survival Time (Seconds):</label>
            <input type="number" id="duration" required min="1" value="1">
          </div>

          <div class="form-submission">
            <button type="submit" id="submit-btn" class="btn btn-submit">Submit Score</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
          </div>
        </form>
      </section>

      <section class="card table-card">
        <h2>Server Dataset</h2>
        <div class="table-space">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Score</th>
                <th>Survival Time (S)</th>
                <th>Points per Second</th>
                <th>Ranking</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="scores-body">
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src='js/main.js' defer></script>
  </body>
</html>
